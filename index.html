@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--tx:#e8eef0;--bd:#37464f;--mu:#9aa9b1;--sub:#1f2c33}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
#app{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.ar{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;direction:rtl;font-size:1.6em;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:1rem;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn.bl{background:var(--b);box-shadow:0 4px 0 var(--bdk)}
.btn.gh{background:var(--bg);color:var(--b);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.card{border:2px solid var(--bd);border-radius:18px;padding:14px;margin-top:12px;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.chip{padding:6px 10px;border-radius:12px;background:var(--sub)}
h1{margin:6px 0;font-size:1.5rem}h2{margin:0 0 4px;font-size:1.1rem}
.mu{color:var(--mu);font-weight:700;font-size:.9rem}
input{width:100%;padding:13px;border:2px solid var(--bd);border-radius:14px;font:inherit;background:var(--sub);color:var(--tx);margin-top:10px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.tab.on{color:#fff;border-color:transparent}
.bar{height:14px;background:var(--bd);border-radius:9px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.opt{display:block;width:100%;text-align:center;padding:14px;margin-top:10px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.opt.ok{border-color:var(--g);background:#d7ffb8;color:#2b6a00}.opt.no{border-color:var(--r);background:#ffdfe0;color:#b00020}
.q{text-align:center;margin:26px 0 10px;font-size:1.25rem}
.fb{margin-top:16px;padding:14px;border-radius:16px;font-weight:800}.fb.ok{background:#d7ffb8;color:#2b6a00}.fb.no{background:#ffdfe0;color:#b00020}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.sp{background:var(--sub);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.cols .opt{margin-top:0;padding:12px 4px;font-size:.9rem;min-height:56px}
.opt.sel{border-color:var(--b);background:#ddf4ff;color:#0b5f8a}.opt.done{opacity:.35;pointer-events:none}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.logo{display:block;width:150px;height:150px;object-fit:cover;object-position:50% 20%;border-radius:50%;border:5px solid var(--g);margin:24px auto 8px}
.big{font-size:3rem;text-align:center;margin-top:30px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov>div{background:var(--bg);border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%;word-break:break-all}
#qr,#qr2{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:10px;border-radius:12px;width:fit-content;margin-inline:auto}

function build(){const l=L[lv],r=rng(hash(td()+lv)),ws=shuf(l.w,r).slice(0,20),T=[["a","i"],["i","a"],["a","e"],["e","a"]];
return ws.map((w,i)=>{let t=i%5,pool,f,g,src=w;if(t==4){src=l.s[(i/5|0)%l.s.length];pool=l.s;f="a";g="i"}else{pool=l.w;[f,g]=T[t]}
const o=shuf([src,...shuf(pool.filter(x=>x!==src),r).slice(0,3)],r);return{q:src[f],qa:f=="a",o:o.map(x=>x[g]),oa:g=="a",c:o.indexOf(src),ar:src.a}})}
function startQ(){Q={l:build(),i:0,h:5,ok:0,lock:false};qz()}
function qz(){const q=Q.l[Q.i];
app.innerHTML=`<div class="top"><button class="sp" onclick="home()">✕</button><div class="bar"><i style="width:${Q.i/20*100}%"></i></div><span class="chip">❤️ ${Q.h}</span></div>

${q.o.map((x,i)=>`<button class="opt ${q.oa?"ar":""}" id="o${i}" onclick="pick(${i})" ${q.oa?"":""}>${x}</button>`).join("")}<div id="fb"></div>`}
function pick(i){if(Q.lock)return;Q.lock=true;const q=Q.l[Q.i],ok=i==q.c;$("o"+q.c).classList.add("ok");if(!ok){$("o"+i).classList.add("no");Q.h--}else{Q.ok++;S.gems++}
const end=Q.h<=0||Q.i==19;$("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Benar! 🎉 +1 💎":"Kurang tepat. Jawaban benar: "+q.o[q.c]}</div><button class="btn ${ok?"":"bl"}" onclick="${end?"fin()":"nxt()"}">${end?"Selesai":"Lanjut"}</button>`}
function nxt(){Q.i++;Q.lock=false;qz()}
function fin(){const win=Q.h>0,xp=Q.ok*5,gm=win?5:0;S.xp+=xp;S.gems+=gm;
if(win){const k=td()+lv;S.done[k]=Math.max(S.done[k]||0,Q.ok);if(S.last!==td()){S.streak=S.last===yd()?S.streak+1:1;S.last=td()}}sv();
app.innerHTML=`${bar()}<div class="big">${win?"🏆":"💔"}</div><h1 style="text-align:center">${win?"Latihan selesai!":"Nyawa habis"}</h1><p style="text-align:center">Benar ${Q.ok} dari ${Q.i+1} soal<br>+${xp} XP${gm?" · +"+gm+" 💎 bonus":""}</p><button class="btn" onclick="home()">Lanjut</button><button class="btn gh" onclick="startQ()">Ulangi</button>`}
